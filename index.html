<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tree of Tables</title>
    <link
      rel="canonical"
      href="https://treeoftables.github.io/monorepo/"
    />
    <meta
      http-equiv="refresh"
      content="0; url=https://treeoftables.github.io/monorepo/"
    />
    <script>
      const destination = new URL("/monorepo/", window.location.origin);
      destination.search = window.location.search;
      destination.hash = window.location.hash;
      window.location.replace(destination);
    </script>
  </head>
  <body>
    <p>
      Redirecting to
      <a href="https://treeoftables.github.io/monorepo/">
        Tree of Tables
      </a>.
    </p>
  </body>
</html>
